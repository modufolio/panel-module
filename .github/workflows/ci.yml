name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# The package requires modufolio/panel and modufolio/appkit from Packagist,
# so there is nothing to check out beside this repository.

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    # 8.6 is still in development: run it so breakage surfaces before the
    # release, without letting a nightly regression redden the build.
    continue-on-error: ${{ matrix.php == '8.6' }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          # appkit's own platform requirements.
          extensions: curl, dom, fileinfo, intl, libxml, pdo, pdo_sqlite, simplexml, sqlite3, zip

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}

      - name: Run tests
        run: composer test

  phpstan:
    name: PHPStan (level 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, fileinfo, intl, libxml, pdo, pdo_sqlite, simplexml, sqlite3, zip

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: composer stan -- --no-progress
